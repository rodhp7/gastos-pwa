<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>gastos — control personal</title>
<meta name="description" content="Controla tus gastos, presupuestos y métodos de pago." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2A41" />

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="gastos" />

<link rel="icon" href="icons/icon-192.png" />

<style>
  :root {
    --parchment: #F6F1E7;
    --parchment-dark: #EDE6D6;
    --surface: #FFFDF8;
    --ink: #1B2A41;
    --text-secondary: #5B6472;
    --text-muted: #8B8578;
    --border: rgba(27,42,65,0.12);
    --gold: #C9A227;
    --danger: #D85A30;
    --alimentacion: #1D9E75; --alimentacion-soft: #E1F5EE;
    --transporte: #D85A30;   --transporte-soft: #FAECE7;
    --servicios: #BA7517;    --servicios-soft: #FAEEDA;
    --ocio: #378ADD;         --ocio-soft: #E6F1FB;
    --otros: #888780;        --otros-soft: #F1EFE8;
    --yape: #742384;
    --plin: #00A99D;
    --transferencia: #185FA5;
    --efectivo: #0F6E56;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .disp { font-family: Georgia, "Times New Roman", serif; }
  .amt { font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", Consolas, monospace; }
  button { cursor: pointer; font-family: inherit; }
  input:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  #page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);
  }
  #phone {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  #screen-area {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 12px;
  }
  nav#bottom-nav {
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border: none;
    background: none;
    padding: 4px;
    color: var(--text-muted);
    font-size: 10px;
  }
  .nav-btn.active { color: var(--ink); }
  .nav-btn svg { width: 20px; height: 20px; }
  .fab {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--ink);
    border: none;
    display: flex; align-items: center; justify-content: center;
    margin-top: -28px;
    box-shadow: 0 2px 6px rgba(27,42,65,0.25);
  }
  .fab svg { width: 22px; height: 22px; stroke: #fff; }

  .section-label { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); margin: 0 0 8px; }
  .empty-state { padding: 24px 0; text-align: center; }
  .empty-state p { font-size: 13px; color: var(--text-muted); margin: 0; }

  .track-outer { height: 6px; border-radius: 3px; background: var(--parchment-dark); overflow: hidden; margin-bottom: 20px; }
  .track-inner { height: 100%; border-radius: 3px; }
  .track-outer-sm { height: 5px; border-radius: 3px; background: var(--parchment-dark); overflow: hidden; }
  .track-inner-sm { height: 100%; border-radius: 3px; }

  .budget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .budget-card { background: #fff; border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; }
  .budget-card .cat-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .budget-card .cat-head span { font-size: 12.5px; font-weight: 500; }
  .budget-card p.amt { font-size: 11.5px; margin: 6px 0 0; color: var(--text-secondary); }

  .tx-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
  .tx-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tx-body { flex: 1; min-width: 0; }
  .tx-body p.name { font-size: 13.5px; margin: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-body p.cat { font-size: 11.5px; color: var(--text-muted); margin: 0; text-transform: capitalize; }
  .tx-pill { font-size: 10.5px; padding: 3px 8px; border-radius: 20px; flex-shrink: 0; }
  .tx-amount { font-size: 13px; flex-shrink: 0; min-width: 62px; text-align: right; color: var(--ink); }

  .icon-btn { border: none; background: none; padding: 4px; color: var(--text-secondary); }
  .icon-btn svg { width: 20px; height: 20px; }

  .cat-chip, .pay-btn { border: 0.5px solid var(--border); background: #fff; border-radius: 20px; font-size: 13px; color: var(--ink); padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
  .pay-btn { border-radius: 12px; padding: 12px; }
  .cat-chip svg, .pay-btn svg { width: 15px; height: 15px; }
  .error-text { font-size: 11.5px; color: var(--danger); margin: 6px 0 0; }

  .primary-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; }

  .field-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0.5px solid var(--border); font-size: 13px; }

  .filter-chip { padding: 6px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: #fff; font-size: 12px; color: var(--ink); text-transform: capitalize; }
  .filter-chip.active { border-width: 1.5px; }

  .budget-row { background: #fff; border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .budget-row .row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .budget-row .row-head span.label { font-size: 13.5px; font-weight: 500; color: var(--ink); flex: 1; }
  .budget-row .row-head span.spent { font-size: 11.5px; color: var(--text-muted); }
  .budget-row .row-input { display: flex; align-items: center; gap: 6px; }
  .budget-row .row-input span { font-size: 14px; color: var(--text-muted); }
  .budget-row .row-input input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 0.5px solid var(--border); font-size: 14px; }

  #save-toast {
    font-size: 11.5px; color: var(--danger); text-align: center; padding: 4px 12px; display: none;
  }
  #install-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    font-size: 12.5px;
  }
  #install-banner button {
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="install-banner">
  <span id="install-text">instala esta app en tu pantalla de inicio para usarla como una app nativa.</span>
  <button id="install-btn">instalar</button>
</div>

<div id="page">
  <div id="phone">
    <div id="screen-area"></div>
    <div id="save-toast">no se pudo guardar. revisa el espacio disponible en tu dispositivo.</div>
    <nav id="bottom-nav">
      <button class="nav-btn" data-screen="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span>inicio</span>
      </button>
      <button class="nav-btn" data-screen="movimientos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
        <span>movimientos</span>
      </button>
      <button class="fab" id="fab-add" aria-label="agregar gasto">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <button class="nav-btn" data-screen="presupuestos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
        <span>presupuestos</span>
      </button>
    </nav>
  </div>
</div>

<script>
(function () {
  "use strict";

  var CATEGORIES = [
    { id: "alimentacion", label: "alimentación", color: "var(--alimentacion)", soft: "var(--alimentacion-soft)", icon: 'shopping-cart' },
    { id: "transporte", label: "transporte", color: "var(--transporte)", soft: "var(--transporte-soft)", icon: 'bus' },
    { id: "servicios", label: "servicios", color: "var(--servicios)", soft: "var(--servicios-soft)", icon: 'zap' },
    { id: "ocio", label: "ocio", color: "var(--ocio)", soft: "var(--ocio-soft)", icon: 'film' },
    { id: "otros", label: "otros", color: "var(--otros)", soft: "var(--otros-soft)", icon: 'more' }
  ];

  var PAYMENT_METHODS = [
    { id: "yape", label: "yape", color: "var(--yape)" },
    { id: "plin", label: "plin", color: "var(--plin)" },
    { id: "transferencia", label: "transferencia", color: "var(--transferencia)" },
    { id: "efectivo", label: "efectivo", color: "var(--efectivo)" }
  ];

  var DEFAULT_BUDGETS = { alimentacion: 800, transporte: 300, servicios: 450, ocio: 400, otros: 200 };
  var STORAGE_KEY = "gastos-app-data";

  var ICONS = {
    'shopping-cart': '<path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 3h2l1 3"/>',
    'bus': '<path d="M4 17h1a2 2 0 0 0 4 0h6a2 2 0 0 0 4 0h1"/><path d="M4 17V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11"/><path d="M4 11h16"/>',
    'zap': '<path d="M13 2 3 14h7l-1 8 10-12h-7z"/>',
    'film': '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16"/><path d="M17 4v16"/><path d="M3 9h4"/><path d="M17 9h4"/><path d="M3 15h4"/><path d="M17 15h4"/>',
    'more': '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
    'x': '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    'check': '<path d="M20 6 9 17l-5-5"/>'
  };

  function icon(name, size, color) {
    size = size || 16;
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  }

  function catInfo(id) {
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
    return CATEGORIES[CATEGORIES.length - 1];
  }
  function payInfo(id) {
    for (var i = 0; i < PAYMENT_METHODS.length; i++) if (PAYMENT_METHODS[i].id === id) return PAYMENT_METHODS[i];
    return PAYMENT_METHODS[0];
  }
  function formatSoles(n) {
    n = Number(n) || 0;
    return "S/ " + n.toLocaleString("es-PE", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function monthKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthLabelFor(key) {
    var parts = key.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, 1);
    return new Intl.DateTimeFormat("es-PE", { month: "long", year: "numeric" }).format(d);
  }
  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  var state = {
    expenses: [],
    budgets: Object.assign({}, DEFAULT_BUDGETS),
    screen: "home",
    addDraft: { amount: "", note: "", category: null, paymentMethod: null },
    filter: "todos"
  };

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.expenses = parsed.expenses || [];
        state.budgets = parsed.budgets || Object.assign({}, DEFAULT_BUDGETS);
      }
    } catch (e) {
      showToast(true);
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ expenses: state.expenses, budgets: state.budgets }));
      showToast(false);
    } catch (e) {
      showToast(true);
    }
  }

  function showToast(isError) {
    var el = document.getElementById("save-toast");
    el.style.display = isError ? "block" : "none";
  }

  function currentMonthExpenses() {
    var cm = monthKey(new Date());
    return state.expenses.filter(function (e) { return monthKey(new Date(e.date)) === cm; });
  }

  function spentByCategory(expenses) {
    var map = {};
    CATEGORIES.forEach(function (c) { map[c.id] = 0; });
    expenses.forEach(function (e) { map[e.category] = (map[e.category] || 0) + Number(e.amount); });
    return map;
  }

  function render() {
    var el = document.getElementById("screen-area");
    if (state.screen === "home") el.innerHTML = renderHome();
    else if (state.screen === "add") el.innerHTML = renderAdd();
    else if (state.screen === "movimientos") el.innerHTML = renderMovimientos();
    else if (state.screen === "presupuestos") el.innerHTML = renderPresupuestos();

    document.querySelectorAll(".nav-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-screen") === state.screen);
    });

    attachScreenHandlers();
  }

  function renderTxRow(e) {
    var cat = catInfo(e.category);
    var pay = payInfo(e.paymentMethod);
    return '' +
      '<div class="tx-row">' +
        '<div class="tx-icon" style="background:' + cat.soft + '">' + icon(cat.icon, 15, cat.color) + '</div>' +
        '<div class="tx-body">' +
          '<p class="name">' + escapeHtml(e.note || cat.label) + '</p>' +
          '<p class="cat">' + cat.label + '</p>' +
        '</div>' +
        '<span class="tx-pill" style="background:color-mix(in srgb, ' + pay.color + ' 14%, white); color:' + pay.color + '">' + pay.label + '</span>' +
        '<span class="tx-amount amt">' + formatSoles(e.amount) + '</span>' +
      '</div>';
  }

  function renderHome() {
    var monthExpenses = currentMonthExpenses();
    var spent = spentByCategory(monthExpenses);
    var totalSpent = Object.keys(spent).reduce(function (a, k) { return a + spent[k]; }, 0);
    var totalBudget = Object.keys(state.budgets).reduce(function (a, k) { return a + Number(state.budgets[k] || 0); }, 0);
    var pct = totalBudget > 0 ? Math.min(100, Math.round((totalSpent / totalBudget) * 100)) : 0;
    var recent = monthExpenses.slice(0, 6);

    var cardsHtml = CATEGORIES.map(function (cat) {
      var s = spent[cat.id] || 0;
      var b = Number(state.budgets[cat.id] || 0);
      var p = b > 0 ? Math.min(100, Math.round((s / b) * 100)) : 0;
      var over = b > 0 && s > b;
      return '' +
        '<div class="budget-card">' +
          '<div class="cat-head">' + icon(cat.icon, 15, cat.color) + '<span>' + cat.label + '</span></div>' +
          '<div class="track-outer-sm"><div class="track-inner-sm" style="width:' + p + '%; background:' + (over ? 'var(--danger)' : cat.color) + '"></div></div>' +
          '<p class="amt" style="' + (over ? 'color:var(--danger)' : '') + '">' + formatSoles(s) + ' / ' + formatSoles(b) + '</p>' +
        '</div>';
    }).join("");

    return '' +
      '<div style="padding:24px 20px 12px">' +
        '<p style="font-size:13px;color:var(--text-muted);margin:0;text-transform:capitalize">' + monthLabelFor(monthKey(new Date())) + '</p>' +
        '<p class="disp" style="font-size:40px;font-weight:600;margin:4px 0 2px">' + formatSoles(totalSpent) + '</p>' +
        '<p style="font-size:13px;color:var(--text-muted);margin:0 0 8px">de ' + formatSoles(totalBudget) + ' presupuestados</p>' +
        '<div class="track-outer"><div class="track-inner" style="width:' + pct + '%; background:' + (pct >= 100 ? 'var(--danger)' : 'var(--gold)') + '"></div></div>' +
        '<p class="section-label">presupuestos por categoría</p>' +
        '<div class="budget-grid">' + cardsHtml + '</div>' +
        '<p class="section-label">movimientos recientes</p>' +
        (recent.length === 0
          ? '<div class="empty-state"><p>aún no registras gastos este mes.</p></div>'
          : recent.map(renderTxRow).join("")) +
      '</div>';
  }

  function renderAdd() {
    var d = state.addDraft;
    var amountValue = escapeHtml(d.amount || "");
    var noteValue = escapeHtml(d.note || "");
    var catChips = CATEGORIES.map(function (cat) {
      var selected = d.category === cat.id;
      return '<button class="cat-chip" data-cat="' + cat.id + '" style="' + (selected ? 'border:1.5px solid ' + cat.color + ';background:' + cat.soft : '') + '">' + icon(cat.icon, 15, cat.color) + cat.label + '</button>';
    }).join("");
    var payButtons = PAYMENT_METHODS.map(function (pay) {
      var selected = d.paymentMethod === pay.id;
      return '<button class="pay-btn" data-pay="' + pay.id + '" style="' + (selected ? 'border:1.5px solid ' + pay.color + ';background:color-mix(in srgb, ' + pay.color + ' 10%, white)' : '') + '">' +
        '<span style="width:10px;height:10px;border-radius:50%;background:' + pay.color + ';flex-shrink:0"></span><span>' + pay.label + '</span></button>';
    }).join("");

    return '' +
      '<div style="padding:20px 20px 12px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">' +
          '<button class="icon-btn" id="cancel-add">' + icon('x', 20) + '</button>' +
          '<p style="font-size:15px;font-weight:500;margin:0">nuevo gasto</p>' +
          '<span style="width:28px"></span>' +
        '</div>' +
        '<div style="text-align:center;margin-bottom:20px">' +
          '<p style="font-size:13px;color:var(--text-muted);margin:0 0 4px">monto</p>' +
          '<div style="display:flex;align-items:baseline;justify-content:center;gap:4px">' +
            '<span class="disp" style="font-size:20px;color:var(--text-muted)">S/</span>' +
            '<input type="number" inputmode="decimal" placeholder="0.00" id="amount-input" class="disp" value="' + amountValue + '" style="border:none;background:none;font-size:38px;font-weight:600;width:160px;text-align:center;color:var(--ink)" />' +
          '</div>' +
          '<p class="error-text" id="amount-error" style="display:none">ingresa un monto válido</p>' +
        '</div>' +
        '<p class="section-label">categoría</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px" id="cat-group">' + catChips + '</div>' +
        '<p class="error-text" id="cat-error" style="display:none">elige una categoría</p>' +
        '<p class="section-label" style="margin-top:16px">método de pago</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px" id="pay-group">' + payButtons + '</div>' +
        '<p class="error-text" id="pay-error" style="display:none">elige un método de pago</p>' +
        '<input type="text" placeholder="nota (opcional)" id="note-input" class="field-input" value="' + noteValue + '" style="margin-top:14px;margin-bottom:18px" />' +
        '<button class="primary-btn" id="save-expense-btn">guardar gasto</button>' +
      '</div>';
  }

  function renderMovimientos() {
    var filtered = state.filter === "todos" ? state.expenses : state.expenses.filter(function (e) { return e.category === state.filter; });
    var groups = {};
    var order = [];
    filtered.forEach(function (e) {
      var d = new Date(e.date);
      var key = d.toLocaleDateString("es-PE", { day: "numeric", month: "long" });
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(e);
    });

    var chips = '<button class="filter-chip' + (state.filter === "todos" ? " active" : "") + '" data-filter="todos" style="' + (state.filter === "todos" ? "border-color:var(--ink)" : "") + '">todos</button>' +
      CATEGORIES.map(function (cat) {
        var active = state.filter === cat.id;
        return '<button class="filter-chip' + (active ? " active" : "") + '" data-filter="' + cat.id + '" style="' + (active ? "border-color:" + cat.color + ";background:" + cat.soft : "") + '">' + cat.label + '</button>';
      }).join("");

    var body = filtered.length === 0
      ? '<div class="empty-state"><p>no hay movimientos con este filtro.</p></div>'
      : order.map(function (key) {
          return '<div style="margin-bottom:14px">' +
            '<p style="font-size:11.5px;color:var(--text-muted);margin:0 0 4px;text-transform:capitalize">' + key + '</p>' +
            groups[key].map(renderTxRow).join("") +
          '</div>';
        }).join("");

    return '' +
      '<div style="padding:20px 20px 12px">' +
        '<p style="font-size:15px;font-weight:500;margin:0 0 14px">movimientos</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px" id="filter-group">' + chips + '</div>' +
        body +
      '</div>';
  }

  function renderPresupuestos() {
    var monthExpenses = currentMonthExpenses();
    var spent = spentByCategory(monthExpenses);
    var rows = CATEGORIES.map(function (cat) {
      var s = spent[cat.id] || 0;
      var b = state.budgets[cat.id];
      return '' +
        '<div class="budget-row">' +
          '<div class="row-head">' + icon(cat.icon, 16, cat.color) + '<span class="label">' + cat.label + '</span><span class="spent amt">gastado ' + formatSoles(s) + '</span></div>' +
          '<div class="row-input"><span class="disp">S/</span><input type="number" inputmode="decimal" data-budget-cat="' + cat.id + '" value="' + b + '" /></div>' +
        '</div>';
    }).join("");

    return '' +
      '<div style="padding:20px 20px 12px">' +
        '<p style="font-size:15px;font-weight:500;margin:0 0 4px">presupuestos</p>' +
        '<p style="font-size:12.5px;color:var(--text-muted);margin:0 0 18px">ajusta cuánto quieres gastar al mes en cada categoría.</p>' +
        rows +
        '<button class="primary-btn" id="save-budgets-btn" style="margin-top:6px">guardar presupuestos</button>' +
      '</div>';
  }

  function attachScreenHandlers() {
    if (state.screen === "add") {
      function syncAddDraftFromInputs() {
        var amountInput = document.getElementById("amount-input");
        var noteInput = document.getElementById("note-input");
        if (amountInput) state.addDraft.amount = amountInput.value;
        if (noteInput) state.addDraft.note = noteInput.value;
      }
      document.getElementById("cancel-add").addEventListener("click", function () {
        state.addDraft = { amount: "", note: "", category: null, paymentMethod: null };
        state.screen = "home";
        render();
      });
      document.querySelectorAll("#cat-group .cat-chip").forEach(function (btn) {
        btn.addEventListener("click", function () {
          syncAddDraftFromInputs();
          state.addDraft.category = btn.getAttribute("data-cat");
          document.getElementById("cat-error").style.display = "none";
          render();
        });
      });
      document.querySelectorAll("#pay-group .pay-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          syncAddDraftFromInputs();
          state.addDraft.paymentMethod = btn.getAttribute("data-pay");
          document.getElementById("pay-error").style.display = "none";
          render();
        });
      });
      document.getElementById("save-expense-btn").addEventListener("click", function () {
        syncAddDraftFromInputs();
        var amountVal = state.addDraft.amount;
        var noteVal = state.addDraft.note;
        var amount = parseFloat(amountVal);
        var ok = true;
        if (!amountVal || isNaN(amount) || amount <= 0) {
          document.getElementById("amount-error").style.display = "block";
          ok = false;
        }
        if (!state.addDraft.category) {
          document.getElementById("cat-error").style.display = "block";
          ok = false;
        }
        if (!state.addDraft.paymentMethod) {
          document.getElementById("pay-error").style.display = "block";
          ok = false;
        }
        if (!ok) return;

        state.expenses.unshift({
          id: Date.now().toString(),
          date: new Date().toISOString(),
          amount: amount,
          category: state.addDraft.category,
          paymentMethod: state.addDraft.paymentMethod,
          note: noteVal.trim()
        });
        persist();
        state.addDraft = { amount: "", note: "", category: null, paymentMethod: null };
        state.screen = "home";
        render();
      });
    } else if (state.screen === "movimientos") {
      document.querySelectorAll("#filter-group .filter-chip").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.filter = btn.getAttribute("data-filter");
          render();
        });
      });
    } else if (state.screen === "presupuestos") {
      document.getElementById("save-budgets-btn").addEventListener("click", function () {
        var next = {};
        CATEGORIES.forEach(function (cat) {
          var input = document.querySelector('[data-budget-cat="' + cat.id + '"]');
          var v = parseFloat(input.value);
          next[cat.id] = isNaN(v) || v < 0 ? 0 : v;
        });
        state.budgets = next;
        persist();
        var btn = document.getElementById("save-budgets-btn");
        btn.innerHTML = icon('check', 16) + ' presupuestos guardados';
        btn.style.display = "flex";
        btn.style.alignItems = "center";
        btn.style.justifyContent = "center";
        btn.style.gap = "6px";
      });
    }
  }

  document.querySelectorAll(".nav-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.screen = btn.getAttribute("data-screen");
      render();
    });
  });
  document.getElementById("fab-add").addEventListener("click", function () {
    state.addDraft = { amount: "", note: "", category: null, paymentMethod: null };
    state.screen = "add";
    render();
  });

  loadData();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" }).then(function (registration) {
        if (registration.waiting) {
          registration.waiting.postMessage({ type: "SKIP_WAITING" });
        }
      }).catch(function () {});
    });
  }

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }

  var deferredPrompt = null;
  var isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) document.getElementById("install-banner").style.display = "flex";
  });

  if (isIos && !isStandalone) {
    document.getElementById("install-text").textContent = "toca compartir y luego \"agregar a inicio\" para instalar esta app.";
    document.getElementById("install-btn").style.display = "none";
    document.getElementById("install-banner").style.display = "flex";
  }

  document.getElementById("install-btn").addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () {
      deferredPrompt = null;
      document.getElementById("install-banner").style.display = "none";
    });
  });
})();
</script>
</body>
</html>
