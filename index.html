<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<!-- Sin zoom: la app se maneja como una nativa. iOS ignora user-scalable en
     algunos casos, así que el pellizco también se bloquea en 18-navigation.js. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<title>Nexo</title>
<meta name="application-name" content="Nexo" />

<meta name="description" content="Nexo: organiza tus gastos, ingresos, presupuesto, ahorro y metas." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#072146" id="meta-theme-color" />

<script>
/* Se aplica el tema antes de pintar la primera vez. Si se hiciera más tarde,
   al abrir la app en modo oscuro se vería un destello blanco. */
(function () {
  var COLOR_BARRA = { claro: "#072146", oscuro: "#0E1116" };
  var preferencia;
  try { preferencia = localStorage.getItem("nexo-tema"); } catch (e) { preferencia = null; }

  var raiz = document.documentElement;
  if (preferencia === "claro" || preferencia === "oscuro") {
    raiz.setAttribute("data-theme", preferencia === "oscuro" ? "dark" : "light");
  } else {
    raiz.removeAttribute("data-theme");
  }

  var oscuroActivo = preferencia === "oscuro" ||
    (preferencia !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var meta = document.getElementById("meta-theme-color");
  if (meta) meta.setAttribute("content", oscuroActivo ? COLOR_BARRA.oscuro : COLOR_BARRA.claro);
})();
</script>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- La app ocupa también la zona de la hora y la batería, y la cubre con una
     franja propia del color de la marca (body::before en styles.css), con el
     texto del sistema en blanco. iOS guarda este valor al añadir la app a la
     pantalla de inicio, así que la maquetación funciona con cualquiera. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nexo" />

<link rel="icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>

<body>

    Instala esta app en tu pantalla de inicio para usarla como una app nativa.

</div>

        <span>Inicio</span>

        <span>Movimientos</span>

      <button type="button" class="tab-item" data-top-screen="cuentas" aria-label="Cuentas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16"/><path d="M4 10 12 4l8 6"/><path d="M6 10v8"/><path d="M12 10v8"/><path d="M18 10v8"/><path d="M4 20h16"/></svg>

        <span>Análisis</span>
      </button>
      <div class="top-menu tab-more">

          <button type="button" class="top-menu-item" role="menuitem" data-top-screen="meses"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendario</span></button>
          <div class="top-menu-sep" role="separator"></div>
          <button type="button" class="top-menu-item" role="menuitem" data-account-open><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Cuenta y sincronización</span></button>
          <button type="button" class="top-menu-item" role="menuitem" data-top-screen="configuracion" id="top-configuracion-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Configuración</span></button>
        </div>
      </div>
    </nav>

    <div id="save-toast">
      No se pudo guardar. Revisa el espacio disponible en tu dispositivo.
    </div>

  </div>

</div>

<script src="config.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="date-utils.js"></script>
<script src="finance-core.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>

</body>
</html>
